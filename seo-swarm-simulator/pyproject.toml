[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "seo-swarm-simulator"
version = "1.0.0"
authors = [
  { name="WebSmitherz Systems Engineering", email="sales@websmitherz.com" },
]
description = "Hardware-safe 62-role adversarial multi-agent SEO swarm simulation engine that models Google ranking reality and commercial conversion friction."
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
keywords = ["seo", "multi-agent", "swarm-intelligence", "google-rankbrain", "navboost", "ai-overviews", "information-gain", "core-web-vitals"]

[project.urls]
"Homepage" = "https://websmitherz.com"
"Schema Generator" = "https://websmitherz.com/tools/contractor-schema-generator"
"Contractor SEO Playbook" = "https://websmitherz.com/services/roofing-seo"
"Bug Tracker" = "https://github.com/ADRZZUBAIRI/github-tools/issues"
"Source" = "https://github.com/ADRZZUBAIRI/github-tools/tree/master/seo-swarm-simulator"

[project.scripts]
seo-swarm = "seo_swarm.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
