[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "seo-swarm-simulator"
version = "1.0.2"
description = "Universal 62-role adversarial multi-agent SEO swarm simulation engine with GSC acquisition gating, verified KD/DA reality caps, and framework-agnostic adapters."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
keywords = ["seo", "multi-agent", "swarm-intelligence", "google-rankbrain", "navboost", "ai-overviews", "information-gain", "core-web-vitals"]

[project.scripts]
seo-swarm = "seo_swarm.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
